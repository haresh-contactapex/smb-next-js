name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build must work without DATABASE_URL (src/lib/db.js only checks it when a query runs).
      - run: npm run build
        env:
          JWT_SECRET: ci-build-secret-not-used-at-runtime
