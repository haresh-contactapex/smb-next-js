name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway database for tests/db.integration.test.mjs (transactions, migrations).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smb_test
      # The build must work without DATABASE_URL (src/lib/db.js only checks it when a query runs).
      - run: npm run build
        env:
          JWT_SECRET: ci-build-secret-not-used-at-runtime
